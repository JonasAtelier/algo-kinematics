<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">A two-link arm sweeping, with its joint angles</title>
  <desc id="d">A two-link arm sweeps through its reachable arc while the two joint angles trace out the motion that puts the tip where it was asked to go.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2238"/>
      <stop offset="1" stop-color="#102f34"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl  { font-family: ui-monospace, monospace; font-size: 12px; fill: #9edbc4; letter-spacing: 1px; }
      .blk  { font-family: ui-monospace, monospace; font-size: 14px; fill: #e8f5ef; letter-spacing: 1.5px; }
      .sml  { font-family: ui-monospace, monospace; font-size: 10px; fill: #9edbc4; letter-spacing: 1px; }
      .wire { stroke: #51c99c; stroke-width: 2.2; fill: none; opacity: .75; }
      .box  { fill: none; stroke: #70e1b2; stroke-width: 2; opacity: .85; }
      .grid { stroke: #234a52; stroke-width: 1; opacity: .55; }
      .amb  { stroke: #f2bd68; stroke-width: 2; fill: none; }
      .sp   { stroke: #f2bd68; stroke-width: 2; stroke-dasharray: 7 7; opacity: .8; }
      .trace{ fill: none; stroke: #70e1b2; stroke-width: 3;
              stroke-dasharray: 1000; stroke-dashoffset: 1000;
              animation: draw 6s linear infinite; }
      .trace2{ fill: none; stroke: #f2bd68; stroke-width: 2.4; opacity: .9;
              stroke-dasharray: 1000; stroke-dashoffset: 1000;
              animation: draw 6s linear infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 72% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .trace, .trace2 { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="200" rx="24" fill="url(#bg)"/>

  <!-- two links reaching a point -->
  <circle cx="84" cy="140" r="7" class="box" fill="#0d2238"/>
  <g id="arm">
    <g>
      <line x1="84" y1="140" x2="196" y2="70" class="wire" stroke-width="4"/>
      <circle cx="196" cy="70" r="6" class="box" fill="#0d2238"/>
      <line x1="196" y1="70" x2="316" y2="106" class="wire" stroke-width="4"/>
      <circle cx="316" cy="106" r="5" fill="#f2bd68"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="-14 84 140;16 84 140;-14 84 140" dur="6s"
                        repeatCount="indefinite"/>
    </g>
  </g>
  <path class="grid" d="M300 40A150 150 0 0 1 300 160" fill="none" stroke-dasharray="5 6"/>
  <text class="sml" x="140" y="98" text-anchor="middle">L1</text>
  <text class="sml" x="256" y="80" text-anchor="middle">L2</text>
  <text class="lbl" x="52" y="42">&#952;1, &#952;2</text>
  <text class="lbl" x="52" y="176">forward and inverse</text>
  <line x1="456" y1="26" x2="456" y2="174" stroke="#234a52" stroke-width="1" opacity=".6"/>
  <g class="grid">
